<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Order</title>
    <script>
      // GitHub Pages SPA redirect
      (function (l) {
        var redirect = l.pathname + l.search + l.hash;
        l.replace("/mobile-order/?/" + redirect.slice(1));
      })(window.location);
    </script>
  </head>
  <body>
    <div>Redirecting...</div>
  </body>
</html>
