name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint
        env:
          CI: true

      - name: Run Type Checking
        run: npm run typecheck
        env:
          CI: true
      - name: Confirm Type Check Result
        run: echo "Type checking completed. If there were errors, the workflow should have failed."
