<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Order</title>
    <script>
      // GitHub Pages用のクライアントサイドルーティング
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = sessionStorage.redirect || l.pathname;
          if (decoded) {
            window.history.replaceState(null, null, decoded);
          }
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // メインアプリケーションにリダイレクト
      window.location.href = "/mobile-order/";
    </script>
  </body>
</html>
