# Lefthook 設定ファイル
# このファイルは、コードの品質と一貫性を確保するために、コミットやプッシュ前に
# Linting、フォーマット、テストなどのタスクを自動化するGitフックを定義します。

pre-commit:
  # コミットが作成される前に実行されるフック。
  # ステージングされたファイルに対してLintingやフォーマットを行い、早期に問題を検出します。
  commands:
    lint:
      # JavaScriptおよびTypeScriptファイルに適用。
      glob: "*.{js,jsx,ts,tsx}"
      # ステージングされたファイルに対してLintingスクリプトを実行し、コードスタイルの問題をチェックします。
      run: npm run lint {staged_files}
    format:
      # JavaScriptおよびTypeScriptファイルに適用。
      glob: "*.{js,jsx,ts,tsx}"
      # ステージングされたファイルに対してフォーマットスクリプトを実行し、一貫したコードスタイルを強制します。
      run: npm run format {staged_files}

pre-push:
  # リモートリポジトリにコミットをプッシュする前に実行されるフック。
  # 変更を共有する前にコードベースが良好な状態であることを確認します。
  commands:
    test:
      # テストスイートを実行し、プッシュ前にすべてのテストが通過することを確認します。
      run: npm test
